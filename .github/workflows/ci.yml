name: CI

# WHY THIS EXISTS. This repository had no CI and no tests. merelang/mere's CI
# checks that its `main` still COMPILES this code (test/downstream/REPOS), but
# "does it build" and "does it still answer HTTP the way its milestones say,
# against a real database" are different questions.
#
# THE ORACLES ARE EXTERNAL: curl speaks the HTTP and PostgreSQL stores the
# rows. Nothing is compared against a recording of this app's own past output.
# What is asserted is documented behaviour and its effects -- created then
# readable, updated then changed, deleted then gone, and a second user refused
# with 403 rather than 401 or 200.

on:
  push:
  pull_request:
  # The compiler moves daily and this repository does not, so a weekly run
  # catches the case where nothing here changed and it broke anyway.
  schedule:
    - cron: "0 3 * * 1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      # BUILT FROM main, NOT FROM THE LATEST RELEASE -- this repository is
      # developed against the compiler as it is. The cost is that a break
      # upstream reddens this repository too, which is the truth of the
      # dependency; merelang/mere's downstream_check tells the two apart from
      # the other side.
      - name: Check out the Mere compiler
        uses: actions/checkout@v5
        with:
          repository: merelang/mere
          path: .mere-compiler

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"

      - name: Build mere
        run: |
          cd .mere-compiler
          opam install . --deps-only
          opam exec -- dune build bin/mere.exe

      # PostgreSQL as BINARIES, not as a service: verify.sh runs its own
      # throwaway cluster with initdb on a port it picks and passes to the app
      # through the environment, so there is no state carried between runs and
      # nothing shared to collide over.
      # libssl-dev because contrib/db's pg.mere declares `tcp_starttls` for
      # sslmode negotiation and the emitted C calls it, so the OpenSSL runtime
      # is compiled in. Not contrib/http, as this comment first said -- checked
      # by reading the emitted C rather than by guessing which package it was.
      - name: PostgreSQL and OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client libssl-dev netcat-openbsd wabt
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"

      # `mere install` fetches http / db / orm into .mere_modules/ per mere.toml.
      - name: Fetch dependencies
        run: .mere-compiler/_build/default/bin/mere.exe install

      # MEASURED before wiring it: 16 checks -- signup, session, duplicate
      # signup, create, show, update and its persistence, comment and the join,
      # ownership refused on both verbs, an anonymous delete refused, the
      # owner's delete, the 404 after it, and logout. Plus four more since
      # v0.1.338: the API and a file route over a VERIFIED TLS connection, an
      # untrusted client refused, and the port/certificate arriving from the
      # environment.
      # A BARE `wait` WAITS FOR THE SERVER TOO, and the server does not exit.
      # verify.sh starts the app in the background; a `wait` with no arguments
      # therefore hangs until GitHub cancels the job at sixty minutes -- with
      # every check that had already passed going unreported. It happened, and it
      # happened twice in one day: the compiler repo's own concurrency gate had
      # the identical line hours earlier. Fixing an instance does not fix a
      # pattern unless something looks for it.
      - name: no bare `wait` (it would wait for the server)
        run: |
          if grep -rn '^[[:space:]]*wait[[:space:]]*$' verify.sh; then
            echo "a bare wait: name the client PIDs instead (for p in \$pids; do wait \$p; done)"
            exit 1
          fi
          echo "ok: no bare wait"

      - name: verify.sh — mere-blog over HTTP against Postgres
        run: MERE="$GITHUB_WORKSPACE/.mere-compiler/_build/default/bin/mere.exe" CC=clang sh verify.sh

      # The six gates written on 2026-08-29. They were not here until now, which
      # made them the thing they were built to find: verify.sh's own history has
      # a commit for wiring gates that nothing ran, and mere's tree had a
      # headless DOM host that nothing called and had rotted unnoticed. Six more
      # of the same were sitting in this directory.
      #
      # verify.sh stops its Postgres on exit, so these start their own on a
      # different port and hand it to every gate through the environment
      # config.mere already reads.
      - name: Postgres for the gates
        run: |
          PGDATA_DIR="$RUNNER_TEMP/gatepg"
          initdb -D "$PGDATA_DIR" -U postgres --auth=trust >/dev/null
          pg_ctl -D "$PGDATA_DIR" -o "-p 15502 -k $PGDATA_DIR -c listen_addresses=127.0.0.1" \
                 -l "$PGDATA_DIR/server.log" start >/dev/null
          for i in $(seq 1 100); do
            psql -h 127.0.0.1 -p 15502 -U postgres -l >/dev/null 2>&1 && break
            sleep 0.1
          done
          createdb -h 127.0.0.1 -p 15502 -U postgres blog
          echo "PGHOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "PGPORT=15502" >> "$GITHUB_ENV"
          echo "PGUSER=postgres" >> "$GITHUB_ENV"
          echo "PGDATABASE=blog" >> "$GITHUB_ENV"
          echo "MERE=$GITHUB_WORKSPACE/.mere-compiler/_build/default/bin/mere.exe" >> "$GITHUB_ENV"

      - name: migration.sh — the migrations run against rows that already exist
        if: ${{ !cancelled() }}
        run: sh migration.sh

      - name: schema for the remaining gates
        if: ${{ !cancelled() }}
        run: |
          "$MERE" -c migrate.mere > /tmp/m.c
          clang -O2 -w /tmp/m.c -lssl -lcrypto -o /tmp/migrate
          /tmp/migrate

      - name: live_soundness.sh — no write leaves a read stale
        if: ${{ !cancelled() }}
        run: sh live_soundness.sh

      - name: authz.sh — no effect runs as nobody
        if: ${{ !cancelled() }}
        run: sh authz.sh

      - name: nojs.sh — the comment flow completes with no JavaScript
        if: ${{ !cancelled() }}
        run: sh nojs.sh

      - name: boundary.sh — every shipped shape of the API, crossed
        if: ${{ !cancelled() }}
        run: sh boundary.sh

      - name: budget.sh — sizes in their bands, pages carry lang/title/labels
        if: ${{ !cancelled() }}
        run: sh budget.sh
