[package]
name = "mere-blog"
version = "0.0.1"

# A small blog (posts + comments) — a Rails-ish web+DB app built to
# dogfood a typed model layer on top of contrib/db/pg. Deps are packages
# in the Mere compiler monorepo (subdir), pinned to a release commit.
[dependencies]
http  = { git = "https://github.com/merelang/mere", subdir = "contrib/http",  rev = "0307da00499255201c2ae089a450d97aca9b371f" }
db    = { git = "https://github.com/merelang/mere", subdir = "contrib/db",    rev = "0307da00499255201c2ae089a450d97aca9b371f" }
orm   = { git = "https://github.com/merelang/mere", subdir = "contrib/orm",   rev = "0307da00499255201c2ae089a450d97aca9b371f" }
# The admin UI: browser bindings, and a JSON parser for reading the
# server's 422 body back into the same FieldError shape validate.mere
# produced.
dom   = { git = "https://github.com/merelang/mere", subdir = "contrib/dom",   rev = "0307da00499255201c2ae089a450d97aca9b371f" }
json  = { git = "https://github.com/merelang/mere", subdir = "contrib/json",  rev = "0307da00499255201c2ae089a450d97aca9b371f" }

# The Node runtime host (scripts + extern glue: http_serve, tcp_connect
# for pg, …) that runs the compiled .wasm. `mere install` vendors it into
# .mere_host/ so running the app needs no compiler checkout. `mere serve`
# runs the wasm on that host.
[host]
git = "https://github.com/merelang/mere"
rev = "0307da00499255201c2ae089a450d97aca9b371f"
